name: Frontend CI

# paths フィルタは意図的に置かない: この check を required にするため、
# backend のみの PR でも必ず実行されて緑になる必要がある（#87）。
# ジョブは約50秒と軽量なので常時実行のコストは許容。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # 週次 schedule。依存監査（audit-ci / npm audit、下記 "Audit" ステップ）を
  # 定期的に再走らせ、マージ後に新規公開された advisory を拾うためのもの。
  #
  # 🔴 既知の限界: public リポジトリの scheduled workflow は、60日間 push 等の
  # activity が無いと GitHub 側で自動的に無効化される
  # （https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule）。
  # このリポジトリが 60日以上休眠すると、休眠に気づくために必要なこの装置自体が
  # 止まる。リポジトリの外から run の日時を監視する仕組みが別途必要
  # （詳細: _work/handoff-nene2-python-2026-08-12-schedule-rollout-note.md）。
  schedule:
    - cron: '15 0 * * 1' # 月曜 00:15 UTC = 09:15 JST（フリート内で分をずらして同時発火を回避）

  # 手動トリガー。simulate_failure=true で check を意図的に失敗させ、
  # notify-failure（下記）が正しく発火するかをその場で検証できる。
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '意図的に check を失敗させ、失敗通知の経路を検証する'
        type: boolean
        default: false

# event_name を含めるのは、schedule / workflow_dispatch の実行が push の実行に
# cancel-in-progress で巻き込まれて消えるのを防ぐため（同じ ref でも event が違えば
# 別グループになる）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # required checks のコンテキスト名。backend-ci.yml の backend-check と
    # 区別するため一意な名前を明示する（job id のままだと両方 "check" で衝突）。
    name: frontend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm run check = type-check + lint + format + test (vitest) + build.
      # Note: the vitest suite had a time-dependent flake history (relativized
      # on 2026-07-07) — if this step fails on an untouched suite, suspect a
      # flake and re-run before changing any test.
      - name: Check (codegen:check, type-check, lint, format, openapi:lint, test, build)
        run: npm run check

      # audit-ci = npm audit + a per-advisory allowlist, so a not-yet-fixable advisory can be
      # excepted with a written, expiring reason instead of blunting the whole gate. Anything
      # high/critical that is not listed in frontend/audit-ci.jsonc still fails.
      # Policy: docs/development/dependency-audit.md
      - name: Audit (fail on high/critical)
        run: npm run audit

  # Kept out of frontend-check so the required gate stays ~50s: this job downloads a
  # browser and boots a dev server. A suite nobody runs rots, so it runs on every PR —
  # it is simply not (yet) a required context.
  e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The catalogue must keep compiling — a story that references a removed prop
      # is a real break, and nothing else catches it.
      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Every request is stubbed via page.route, so no API container is needed.
      - name: Playwright e2e
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # 週次 schedule の失敗は、push/PR の失敗と違って「起こした本人がその場で見る」ことが
  # ない。誰にも気づかれないまま埋もれるのを防ぐため、schedule 実行の失敗（と
  # 検証用の simulate_failure）に限定して Issue を起票する。
  # 実装元: nene2-python PR #773-775 / 申し送り: _work/handoff-nene2-python-2026-08-12-schedule-rollout-note.md
  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 nene-field: 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }} # 必須: checkout していないジョブでは gh がリポジトリを特定できない
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
